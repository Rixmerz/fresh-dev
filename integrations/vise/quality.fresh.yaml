# fresh-dev quality profile for vise — copy to <project>/.vise/quality.yaml, or
# merge the keys into an existing profile. /fresh-dev:init proposes this file.
#
# How vise runs each entry (quality_check validator):
#   - argv is executed WITHOUT a shell, so no pipes, globs, `&&` or $VARS.
#   - a bare binary such as `deno` is resolved on the PATH of the vise MCP
#     server process (Claude Code's environment), not on the project's PATH.
#     If `deno` is not on that PATH, replace it with its absolute path, for
#     example "/home/<user>/.deno/bin/deno".
#   - <ABS_PATH_TO_PLUGIN> must be the absolute path of the installed fresh-dev
#     plugin root (the directory holding mcp/cli.ts). quality.yaml does not
#     expand ${CLAUDE_PLUGIN_ROOT}; /fresh-dev:init fills the value in.
#     Once the CLI is published on JSR the entry becomes
#     ["deno", "run", "-A", "jsr:@rixmerz/fresh-mcp@<ver>/cli", "validate", ".", "--json"].
#   - a check whose binary is missing skip-passes with source="asserted"; only a
#     command that runs and exits nonzero blocks.
#
# Workflow nodes gate on the check NAME. quality-gate-graph.yaml does not gate
# on `fresh`; to use it in a project workflow add
#   validators: [{type: quality_check, check: fresh, weight: 1.0}]
# and run `vise approve fresh` once on the machine.

checks:
  lint:  ["deno", "lint"]
  fmt:   ["deno", "fmt", "--check"]
  # Fresh 2.x (vite): add "vite.config.ts". Fresh 1.x: "main.ts" is enough,
  # it imports fresh.gen.ts and through it every route and island.
  types: ["deno", "check", "main.ts", "dev.ts"]
  unit:  ["deno", "test", "-A"]
  # fresh-dev structural validator: exit 0 ok, 1 on any error-severity
  # finding, 2 when the directory is not a Fresh project, 3 on internal error.
  fresh: ["deno", "run", "-A", "<ABS_PATH_TO_PLUGIN>/mcp/cli.ts", "validate", ".", "--json"]
